<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chatmux">
  <title>Chatmux</title>
  <defs>
    <!-- Catch-light along the top edge: the chassis reads as a lit object
         rather than a flat tile, matching the surface treatment in the UI. -->
    <linearGradient id="cm-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Operator rail glow. -->
    <linearGradient id="cm-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3D80" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FF3D80" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF3D80" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Chassis -->
  <rect width="128" height="128" rx="28" fill="#0A0C10"/>
  <rect width="128" height="128" rx="28" fill="url(#cm-sheen)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Four provider channels at graduated levels. Order and proportions match
       the wordmark glyph in the app header. -->
  <g>
    <rect x="16" y="50" width="18" height="38" rx="9" fill="#10B981"/>
    <rect x="42" y="26" width="18" height="62" rx="9" fill="#4C8DFF"/>
    <rect x="68" y="61" width="18" height="27" rx="9" fill="#FF8A3D"/>
    <rect x="94" y="40" width="18" height="48" rx="9" fill="#E5A06A"/>
  </g>

  <!-- The operator's rail: every channel terminates on one desk. -->
  <rect x="16" y="96" width="96" height="6" rx="3" fill="url(#cm-rail)"/>
</svg>
